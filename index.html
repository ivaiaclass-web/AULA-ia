<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC TransformAção Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#1e293b;
    padding:20px;
}

header{
    margin-bottom:25px;
}

header h1{
    font-size:32px;
    margin-bottom:5px;
}

header p{
    color:#64748b;
}

.topbar{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input, select{
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    min-width:220px;
    background:white;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.card h3{
    font-size:14px;
    color:#64748b;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.chart-container{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.table-container{
    overflow:auto;
    background:white;
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#2563eb;
    color:white;
}

th, td{
    padding:14px;
    border-bottom:1px solid #e2e8f0;
    text-align:left;
    font-size:14px;
}

tbody tr:hover{
    background:#f8fafc;
}

.status{
    margin-bottom:15px;
    font-weight:bold;
}

.loading{
    color:#2563eb;
}

.error{
    color:#dc2626;
}

.footer{
    margin-top:20px;
    color:#64748b;
    font-size:14px;
}

@media(max-width:768px){
    .topbar{
        flex-direction:column;
    }

    input, select{
        width:100%;
    }
}
</style>
</head>
<body>

<header>
    <h1>SAC TransformAção</h1>
    <p>Dashboard de Atendimento ao Cliente</p>
</header>

<div class="status loading" id="status">
    Carregando dados...
</div>

<div class="topbar">
    <input type="text" id="search" placeholder="Buscar cliente, pedido, produto ou status">

    <select id="statusFilter">
        <option value="">Todos os Status</option>
    </select>

    <select id="priorityFilter">
        <option value="">Todas Prioridades</option>
    </select>
</div>

<div class="cards">
    <div class="card">
        <h3>Total de Atendimentos</h3>
        <p id="totalAtendimentos">0</p>
    </div>

    <div class="card">
        <h3>Atendimentos Abertos</h3>
        <p id="abertos">0</p>
    </div>

    <div class="card">
        <h3>Atendimentos Críticos</h3>
        <p id="criticos">0</p>
    </div>

    <div class="card">
        <h3>Produto com Mais Registros</h3>
        <p id="topProduto">-</p>
    </div>
</div>

<div class="chart-container">
    <h2 style="margin-bottom:15px;">Produtos com Mais Atendimentos</h2>
    <canvas id="grafico" height="120"></canvas>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Prioridade</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="footer">
    Última atualização: <span id="lastUpdate">-</span>
</div>

<script>
// URL CSV pública do Google Sheets
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwsMRgPFIsNvNFey1ss4wWLh9tlHEl-rNrBa_ilKhaAAjwhcAKorPn_zbFSJjwXR33xp5oWFe9YQ7O/pub?gid=0&single=true&output=csv";

let dados = [];

// Escapa HTML para reduzir risco de XSS
function escapeHTML(valor){
    if(valor === null || valor === undefined) return "";

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// Converte CSV em array de objetos
function csvToJson(csv){

    const linhas = csv.trim().split("\n");

    const headers = linhas[0].split(",");

    return linhas.slice(1).map(linha => {

        const valores = linha.split(",");

        let obj = {};

        headers.forEach((header, index) => {
            obj[header.trim()] = (valores[index] || "").trim();
        });

        return obj;
    });
}

// Carrega dados do CSV
async function carregarDados(){

    const status = document.getElementById("status");

    status.className = "status loading";
    status.innerText = "Carregando dados...";

    try{

        const response = await fetch(CSV_URL);

        if(!response.ok){
            throw new Error("Falha ao carregar CSV");
        }

        const csv = await response.text();

        dados = csvToJson(csv);

        atualizarFiltros();
        aplicarFiltros();

        status.innerText = "Dados carregados com sucesso.";
        status.className = "status";

        document.getElementById("lastUpdate").innerText =
            new Date().toLocaleString("pt-BR");

    }catch(error){

        console.error(error);

        status.innerText = "Erro ao carregar os dados do CSV.";
        status.className = "status error";
    }
}

// Atualiza filtros dinamicamente
function atualizarFiltros(){

    const statusFilter = document.getElementById("statusFilter");
    const priorityFilter = document.getElementById("priorityFilter");

    const statuses = [...new Set(dados.map(d => d.Status || "Não informado"))];
    const prioridades = [...new Set(dados.map(d => d.Prioridade || "Não informado"))];

    statusFilter.innerHTML = '<option value="">Todos os Status</option>';
    priorityFilter.innerHTML = '<option value="">Todas Prioridades</option>';

    statuses.forEach(item => {
        statusFilter.innerHTML += `<option value="${escapeHTML(item)}">${escapeHTML(item)}</option>`;
    });

    prioridades.forEach(item => {
        priorityFilter.innerHTML += `<option value="${escapeHTML(item)}">${escapeHTML(item)}</option>`;
    });
}

// Aplica busca e filtros
function aplicarFiltros(){

    const busca = document.getElementById("search").value.toLowerCase();

    const status = document.getElementById("statusFilter").value;
    const prioridade = document.getElementById("priorityFilter").value;

    const filtrados = dados.filter(item => {

        const textoBusca = `
            ${item.Nome_Cliente || ""}
            ${item.Numero_Pedido || ""}
            ${item.Produto || ""}
            ${item.Status || ""}
        `.toLowerCase();

        const buscaOk = textoBusca.includes(busca);

        const statusOk = !status || item.Status === status;

        const prioridadeOk = !prioridade || item.Prioridade === prioridade;

        return buscaOk && statusOk && prioridadeOk;
    });

    atualizarKPIs(filtrados);
    atualizarTabela(filtrados);
    desenharGrafico(filtrados);
}

// Atualiza cards KPI
function atualizarKPIs(lista){

    document.getElementById("totalAtendimentos").innerText = lista.length;

    const abertos = lista.filter(item =>
        (item.Status || "").toLowerCase().includes("aberto")
    ).length;

    document.getElementById("abertos").innerText = abertos;

    const criticos = lista.filter(item =>
        (item.Prioridade || "").toLowerCase().includes("alta") ||
        (item.Prioridade || "").toLowerCase().includes("crítica")
    ).length;

    document.getElementById("criticos").innerText = criticos;

    const produtos = {};

    lista.forEach(item => {
        const produto = item.Produto || "Não informado";
        produtos[produto] = (produtos[produto] || 0) + 1;
    });

    let topProduto = "-";
    let maior = 0;

    Object.entries(produtos).forEach(([produto, total]) => {
        if(total > maior){
            maior = total;
            topProduto = produto;
        }
    });

    document.getElementById("topProduto").innerText = topProduto;
}

// Atualiza tabela
function atualizarTabela(lista){

    const tbody = document.getElementById("tableBody");

    tbody.innerHTML = "";

    if(lista.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="8">Nenhum registro encontrado.</td>
            </tr>
        `;

        return;
    }

    lista.forEach(item => {

        tbody.innerHTML += `
            <tr>
                <td>${escapeHTML(item.ID || "-")}</td>
                <td>${escapeHTML(item.Data_Abertura || "-")}</td>
                <td>${escapeHTML(item.Numero_Pedido || "-")}</td>
                <td>${escapeHTML(item.Nome_Cliente || "-")}</td>
                <td>${escapeHTML(item.Produto || "-")}</td>
                <td>${escapeHTML(item.Categoria || "-")}</td>
                <td>${escapeHTML(item.Prioridade || "-")}</td>
                <td>${escapeHTML(item.Status || "-")}</td>
            </tr>
        `;
    });
}

// Desenha gráfico simples usando Canvas puro
function desenharGrafico(lista){

    const canvas = document.getElementById("grafico");

    const ctx = canvas.getContext("2d");

    const produtos = {};

    lista.forEach(item => {

        const produto = item.Produto || "Não informado";

        produtos[produto] = (produtos[produto] || 0) + 1;
    });

    const entries = Object.entries(produtos)
        .sort((a,b) => b[1] - a[1])
        .slice(0,5);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(entries.length === 0) return;

    const larguraBarra = 70;
    const espacamento = 30;
    const alturaMaxima = 200;

    const maxValor = Math.max(...entries.map(e => e[1]));

    entries.forEach((item, index) => {

        const x = 40 + index * (larguraBarra + espacamento);

        const altura = (item[1] / maxValor) * alturaMaxima;

        const y = 260 - altura;

        ctx.fillStyle = "#2563eb";
        ctx.fillRect(x, y, larguraBarra, altura);

        ctx.fillStyle = "#111827";
        ctx.font = "12px Arial";

        ctx.fillText(item[1], x + 25, y - 10);

        const nome = item[0].substring(0,10);

        ctx.fillText(nome, x, 280);
    });
}

// Eventos dos filtros
document.getElementById("search")
    .addEventListener("input", aplicarFiltros);

document.getElementById("statusFilter")
    .addEventListener("change", aplicarFiltros);

document.getElementById("priorityFilter")
    .addEventListener("change", aplicarFiltros);

// Carrega dados ao iniciar
carregarDados();

// Atualiza automaticamente a cada 90 segundos
setInterval(carregarDados, 90000);
</script>

</body>
</html>
